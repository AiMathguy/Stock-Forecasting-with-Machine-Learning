name: train_models
display_name: Train stock prediction models
version: 5
type: command

inputs:
  input_data:
    type: uri_folder

outputs:
  output_data:
    type: uri_folder

code: .
environment: azureml:stock-prediction-env:6

command: >-
  python train.py
  --data-csv ${{inputs.input_data}}
  --output-dir ${{outputs.output_data}}
