name: Drift Detector

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - ".github/workflows/drift-detector.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  detect-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure ML CLI
        run: az extension add --name ml --upgrade

      - name: Submit drift detector
        run: |
          az ml job create \
            --file ./src/drift_detector_job.yml \
            --resource-group rg-thatobilankulu01-3617 \
            --workspace-name stock-trading-ml