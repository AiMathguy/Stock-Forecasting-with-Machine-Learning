trigger:
  - main

variables:
  - group: datapipeline-vg
  - group: keys-vg

stages:
  - stage: Build
    jobs:
      - job: BuildDataFactory
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureResourceManagerTemplateDeployment@3
            inputs:
              deploymentScope: 'Resource Group'
              azureResourceManagerConnection: $(AZURE_RM_CONNECTION)
              subscriptionId: $(SubscriptionId)
              action: 'Create Or Update Resource Group'
              resourceGroupName: $(RESOURCE_GROUP)
              location: $(LOCATION)
              templateLocation: 'Linked artifact'
              cacheArtifacts: true

  - stage: Deploy_Dev
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToDevFactory
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureDataFactoryPublish@1
                  inputs:
                    ConnectedServiceName: $(AZURE_RM_CONNECTION)
                    DataFactoryName: $(DATA_FACTORY_DEV_NAME)
                    ResourceGroupName: $(RESOURCE_GROUP)

  - stage: Deploy_Test
    dependsOn: Deploy_Dev
    condition: succeeded()
    jobs:
      - deployment: DeployToTestFactory
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'Test'
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureDataFactoryPublish@1
                  inputs:
                    ConnectedServiceName: $(AZURE_RM_CONNECTION)
                    DataFactoryName: $(DATA_FACTORY_TEST_NAME)
                    ResourceGroupName: $(RESOURCE_GROUP)